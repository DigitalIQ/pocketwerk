<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pocketwerk mark concepts, round 1</title>
<style>
  body{margin:0;font:14px/1.4 -apple-system,system-ui,sans-serif;background:#fff;color:#111}
  .row{display:grid;grid-template-columns:200px repeat(2,1fr);gap:0;border-bottom:1px solid #ddd}
  .lab{padding:16px}
  .cell{display:flex;align-items:end;gap:18px;padding:16px}
  .dark{background:#111;color:#eee}
  .ink{color:#16181a}.paper{color:#f2f2ee}
  svg{display:block}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <pattern id="holes" width="12.5" height="12.5" patternUnits="userSpaceOnUse" x="6.25" y="6.25">
      <circle cx="6.25" cy="6.25" r="1.5" fill="currentColor" opacity=".28"/>
    </pattern>
  </defs>
  <!-- 1 hanging pocket on a pegboard -->
  <symbol id="c1" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="var(--fg)"/>
    <rect width="100" height="100" rx="22" fill="url(#holes)" style="color:var(--bg)"/>
    <g fill="var(--bg)" stroke="var(--fg)" stroke-width="3">
      <rect x="23" y="28" width="21" height="21" rx="5.5" transform="rotate(-12 33.5 38.5)"/>
      <rect x="39.5" y="20" width="21" height="21" rx="5.5"/>
      <rect x="56" y="28" width="21" height="21" rx="5.5" transform="rotate(12 66.5 38.5)"/>
      <path d="M18 46h64l-5 31q-1 6.5-7.5 6.5h-39Q24 83.5 23 77Z"/>
    </g>
    <path d="M27 54.5h46" stroke="var(--fg)" stroke-width="2.6" stroke-linecap="round" opacity=".5"/>
  </symbol>
  <!-- 2 stitched pocket -->
  <symbol id="c2" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="var(--fg)"/>
    <rect x="27" y="21" width="19" height="19" rx="5" fill="var(--bg)" transform="rotate(-9 36 30)"/>
    <rect x="52" y="19" width="19" height="19" rx="5" fill="var(--bg)" transform="rotate(7 61 28)"/>
    <path d="M22 34h56v30L50 82 22 64Z" fill="var(--bg)" stroke="var(--fg)" stroke-width="3"/>
    <path d="M28 40h44v21.5L50 75.5 28 61.5Z" fill="none" stroke="var(--fg)" stroke-width="2" stroke-dasharray="3.2 2.6"/>
  </symbol>
  <!-- 3 dock + popup -->
  <symbol id="c3" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="var(--fg)"/>
    <path d="M22 16h56q6 0 6 6v34q0 6-6 6H57l-7 7-7-7H22q-6 0-6-6V22q0-6 6-6Z" fill="var(--bg)"/>
    <g fill="var(--fg)"><rect x="25" y="24" width="22" height="13" rx="4"/><rect x="53" y="24" width="22" height="13" rx="4"/><rect x="25" y="41" width="22" height="13" rx="4"/><rect x="53" y="41" width="22" height="13" rx="4"/></g>
    <rect x="14" y="76" width="72" height="12" rx="6" fill="var(--bg)" opacity=".35"/>
    <rect x="44" y="74" width="12" height="16" rx="4" fill="var(--bg)"/>
  </symbol>
  <!-- 4 fanned stack from a slot -->
  <symbol id="c4" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="var(--fg)"/>
    <g fill="var(--bg)" stroke="var(--fg)" stroke-width="3">
      <rect x="24" y="20" width="30" height="30" rx="8" transform="rotate(-22 50 78)"/>
      <rect x="35" y="16" width="30" height="30" rx="8"/>
      <rect x="46" y="20" width="30" height="30" rx="8" transform="rotate(22 50 78)"/>
    </g>
    <rect x="16" y="62" width="68" height="20" rx="8" fill="var(--bg)"/>
    <rect x="24" y="68" width="52" height="4" rx="2" fill="var(--fg)"/>
  </symbol>
  <!-- 5 shadow board outline -->
  <symbol id="c5" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="var(--fg)"/>
    <rect width="100" height="100" rx="22" fill="url(#holes)" style="color:var(--bg)"/>
    <g fill="none" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <rect x="38" y="20" width="24" height="24" rx="6"/>
      <path d="M22 44h56l-5 30q-1 6-7 6H34q-6 0-7-6Z"/>
    </g>
    <circle cx="30" cy="36" r="3" fill="var(--bg)"/><circle cx="70" cy="36" r="3" fill="var(--bg)"/>
  </symbol>
  <!-- 6 compartment pops up -->
  <symbol id="c6" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="var(--fg)"/>
    <g fill="var(--bg)" opacity=".4"><rect x="20" y="44" width="27" height="17" rx="5"/><rect x="20" y="66" width="27" height="17" rx="5"/><rect x="53" y="66" width="27" height="17" rx="5"/></g>
    <rect x="53" y="44" width="27" height="17" rx="5" fill="none" stroke="var(--bg)" stroke-width="2.5" stroke-dasharray="3 3" opacity=".7"/>
    <rect x="49" y="14" width="35" height="24" rx="6" fill="var(--bg)"/>
  </symbol>
</svg>
<div id="rows"></div>
<script>
const names={c1:"1 Hanging pocket (pegboard)",c2:"2 Stitched pocket",c3:"3 Dock + popup",c4:"4 Fanned stack from a slot",c5:"5 Shadow-board outline",c6:"6 Compartment pops up"};
const sizes=[192,64,32,16];
let h="";
for(const id in names){
  h+=`<div class="row"><div class="lab"><b>${names[id]}</b></div>`;
  for(const mode of ["light","dark"]){
    const fg = mode==="light"?"#16181a":"#f2f2ee", bg = mode==="light"?"#f2f2ee":"#16181a";
    h+=`<div class="cell ${mode==="dark"?"dark":""}" style="--fg:${fg};--bg:${bg};color:${fg}">`+sizes.map(s=>`<svg width="${s}" height="${s}"><use href="#${id}"/></svg>`).join("")+`</div>`;
  }
  h+="</div>";
}
document.getElementById("rows").innerHTML=h;
</script>
</body></html>
